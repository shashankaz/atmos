name: Build Atmos

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Zip build
        run: zip -r atmos.zip dist

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Atmos — latest build
          body: |
            Automatically built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            **Installation:**
            1. Download `atmos.zip` and unzip it
            2. Open Chrome and go to `chrome://extensions`
            3. Enable **Developer mode**
            4. Click **Load unpacked** and select the `dist` folder
            5. Open a new tab, click the gear in the bottom-right corner, and add
               your OpenWeatherMap key and coordinates

            There is no build-time configuration: you supply your own key, which is
            kept in that browser's `localStorage` and sent only to OpenWeatherMap.
          files: atmos.zip
          make_latest: true